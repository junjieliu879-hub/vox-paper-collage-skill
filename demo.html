<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>纸层机制演示</title>
<style>body{margin:0;background:#111e2d;color:#f0e5cb;font:16px system-ui}canvas{display:block;width:100%;max-height:85vh;object-fit:contain}footer{padding:12px}input{width:60%}button{padding:6px 16px}</style>
<canvas id="film" width="1280" height="720"></canvas><footer><button id="toggle">播放</button> <input id="seek" type="range" min="0" max="6" step="0.01" value="0"> <span id="time">0.00</span> <p>机制演示：远层、中层、主体、前景分别绘制。它验证分层与取帧，不代表复杂版画成片的美术标准。</p></footer>
<script>
const cv=document.getElementById('film'),ctx=cv.getContext('2d');
window.DUR=6;window.READY=false;
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)};
// Fixed texture coordinates: no frame-to-frame randomness or externally sourced assets.
const texture=document.createElement('canvas');texture.width=texture.height=256;
const tc=texture.getContext('2d');for(let k=0;k<3200;k++){tc.fillStyle=k%3?'#00000012':'#ffffff27';tc.fillRect((k*97+13)%256,(k*k*31+k*17)%256,1+k%3,1);}
const grain=ctx.createPattern(texture,'repeat');
function sheet(points,color){ctx.save();ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.shadowColor='#050a1688';ctx.shadowBlur=8;ctx.shadowOffsetX=4;ctx.shadowOffsetY=7;ctx.fillStyle=color;ctx.fill();ctx.shadowColor='transparent';ctx.lineWidth=5;ctx.strokeStyle='#eee0bf';ctx.stroke();ctx.clip();ctx.fillStyle=grain;ctx.fillRect(-1800,-1000,5000,3000);ctx.restore();}
function mountains(dx,color,y,size){ctx.save();ctx.translate(-dx,y);const pts=[[-80,310]];for(let x=-80;x<=1760;x+=80)pts.push([x,Math.sin(x*.019)*size+(x%160===0?0:110)]);pts.push([1840,450],[-80,450]);sheet(pts,color);ctx.restore();}
function boat(x,y){ctx.save();ctx.translate(x,y);sheet([[-150,5],[150,5],[106,76],[-110,76]],'#9f4735');ctx.fillStyle='#ede0ba';ctx.fillRect(-8,-255,12,265);sheet([[-18,-252],[-128,-31],[-20,-34]],'#e7d7ac');sheet([[11,-245],[118,-28],[10,-30]],'#f1e6cb');ctx.save();ctx.beginPath();ctx.moveTo(11,-245);ctx.lineTo(118,-28);ctx.lineTo(10,-30);ctx.clip();ctx.strokeStyle='#383b4777';ctx.lineWidth=1.5;for(let n=-230;n<0;n+=9){ctx.beginPath();ctx.moveTo(0,n);ctx.lineTo(150,n+35);ctx.stroke();}ctx.restore();ctx.restore();}
function waves(t,dx){const pts=[[-60,620]];for(let x=-60;x<=1400;x+=18)pts.push([x,570+15*Math.sin((x+dx)*.018+t)]);pts.push([1400,770],[-60,770]);sheet(pts,'#274e64');}
window.render=t=>{t=Math.max(0,Math.min(window.DUR,t));ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#142d48';ctx.fillRect(0,0,1280,720);ctx.fillStyle=grain;ctx.fillRect(0,0,1280,720);const dx=280*ease((t-1)/3.5);mountains(dx*.25,'#8a8d8f',260,35);mountains(dx,'#4f6b79',400,45);const progress=ease((t-.2)/4.5);boat(290+610*progress-dx,525+2*Math.sin(t*1.8));waves(t,dx*1.25);ctx.fillStyle='#f4e5be';ctx.font='bold 38px sans-serif';ctx.fillText('PAPER / LAYERS / CAMERA',52,78);ctx.font='20px sans-serif';ctx.fillText('A small, deterministic rendering demo',55,110);};
window.render(0);window.READY=true;
let playing=false,clock=0,last=null;const slider=document.getElementById('seek'),label=document.getElementById('time'),button=document.getElementById('toggle');
function display(t){window.render(t);slider.value=t;label.textContent=t.toFixed(2);}
button.onclick=()=>{if(clock>=window.DUR)clock=0;playing=!playing;last=null;button.textContent=playing?'暂停':'播放'};
slider.oninput=()=>{playing=false;button.textContent='播放';clock=Number(slider.value);display(clock);};
function tick(now){if(playing){if(last!==null)clock=Math.min(window.DUR,clock+(now-last)/1000);display(clock);if(clock>=window.DUR){playing=false;button.textContent='播放';}}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
