<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#231c23}canvas{display:block;width:100%;height:100%}</style>
<canvas id="film" width="1920" height="1080"></canvas><script src="timeline.js"></script><script>
// V2: detailed printed paper cutouts + repaired background plates. One seek-safe timeline.
const cv=document.getElementById('film'),ctx=cv.getContext('2d');window.DUR=20;
const files=['harbor-bg','harbor-ship','ocean-bg','ocean-ship','exchange-bg','exchange-left','exchange-right','exchange-left-after','exchange-right-after','coast-bg','coast-ship'];
const art={};const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const inAt=(t,a,d=.6)=>ease((t-a)/d);
const pendulum=(t,phase=0)=>Math.sin(t*1.65+phase);
function image(name,x,y,w,h){ctx.drawImage(art[name],x,y,w,h)}
function bg(name,t,zoom=.018){const v=zoom*inAt(t,0,4),w=960*(1+v),h=540*(1+v);image(name,(960-w)/2,(540-h)/2,w,h)}
function cut(name,x,y,w,h,angle=0){ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate(angle);ctx.shadowColor='#12101ac7';ctx.shadowBlur=10;ctx.shadowOffsetX=6;ctx.shadowOffsetY=8;image(name,-w/2,-h/2,w,h);ctx.restore()}
function handoff(before,after,x,y,w,h,t,angle){cut(t<3.27?before:after,x,y,w,h,angle)}
function forewave(name,t){let a=art[name],shift=4*pendulum(t);ctx.save();ctx.beginPath();ctx.moveTo(0,480);for(let x=0;x<=960;x+=12)ctx.lineTo(x,457+5*Math.sin(x/32+t*1.5));ctx.lineTo(960,540);ctx.lineTo(0,540);ctx.clip();ctx.drawImage(a,0,760,a.width,a.height-760,-12+shift,432,984,108);ctx.restore()}
function paper(x,y,w,h,fill='#f3e5c7'){ctx.save();ctx.shadowColor='#130e17a8';ctx.shadowBlur=9;ctx.shadowOffsetX=5;ctx.shadowOffsetY=6;ctx.beginPath();ctx.moveTo(x-4,y+4);for(let i=0;i<=18;i++)ctx.lineTo(x+i*w/18,y+(i%3-1)*2);ctx.lineTo(x+w+4,y+h-3);for(let i=18;i>=0;i--)ctx.lineTo(x+i*w/18,y+h+(i%4-1)*2);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='#fdf4da';ctx.lineWidth=2;ctx.stroke();ctx.clip();for(let k=0;k<650;k++){let xx=x+((k*137+31)%Math.max(1,w)),yy=y+((k*47+k*k)%Math.max(1,h));ctx.fillStyle=k%3?'#65472912':'#ffffff36';ctx.fillRect(xx,yy,1.5+(k%5===0),1)}ctx.restore()}
function title(s,x,y,w,t,at=1.15,small=''){let p=inAt(t,at,.45);if(p<=0)return;ctx.save();ctx.translate(x+w/2,y+24);ctx.rotate((1-p)*-.075);ctx.scale(1+(1-p)*.27,1+(1-p)*.27);ctx.translate(-w/2,-24);paper(0,0,w,53);ctx.fillStyle='#ba3d31';ctx.textBaseline='middle';ctx.font='900 32px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';ctx.fillText(s,18,28);if(small){ctx.fillStyle='#5e504c';ctx.font='700 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';ctx.fillText(small,w-98,28)}paper(19,-10,48,12,'#e1cfaa');ctx.restore()}
function subtitle(t){let q=window.CUES.find(q=>t>=q.at&&t<q.end+.12);if(!q)return;let w=Math.min(710,Math.max(320,q.text.length*27+35)),x=(960-w)/2;ctx.save();ctx.globalAlpha=.94;paper(x,485,w,39,'#f6e8c8');ctx.fillStyle='#252b32';ctx.font='700 22px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';ctx.textBaseline='middle';ctx.textAlign='center';ctx.fillText(q.text,480,506);ctx.restore()}
function scene0(t){bg('harbor-bg',t,.018);let p=inAt(t,.22,2.1),sway=pendulum(t)*.009;cut('harbor-ship',80+278*p,15+2*pendulum(t),515,420,sway);forewave('harbor-bg',t);title('郑和启航',68,58,278,t,1.18,'1405');}
function scene1(t){bg('ocean-bg',t,.03);let p=inAt(t,.2,2.35);cut('ocean-ship',74+217*p,56+3*pendulum(t),566,377,pendulum(t)*.007);forewave('ocean-bg',t);title('驶入印度洋',62,62,318,t,1.1);}
function scene2(t){bg('exchange-bg',t,.022);let a=inAt(t,.18,1.25),b=inAt(t,.36,1.4);let meet=inAt(t,1.48,1.1),apart=inAt(t,3.27,.55);let lx=49+154*a+29*meet-14*apart,rx=668-154*b-38*meet+14*apart;handoff('exchange-left','exchange-left-after',lx,93+2*pendulum(t),286,429,t,(1-a)*-.07+meet*.012);handoff('exchange-right','exchange-right-after',rx,94+2*pendulum(t,1.7),285,428,t,(1-b)*.07-meet*.012);let flash=clamp(1-Math.abs(t-3.27)/.13);if(flash>0){ctx.save();ctx.translate(498,224);ctx.scale(flash,flash);ctx.beginPath();for(let k=0;k<24;k++){let r=k%2?63:75,a=k*Math.PI/12;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fillStyle='#f2e2bd';ctx.shadowColor='#3c29268a';ctx.shadowBlur=10;ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='#fff6d9';ctx.lineWidth=3;ctx.stroke();ctx.restore()}title('港口互通',62,60,270,t,2.22)}
function scene3(t){bg('coast-bg',t,.018);let p=inAt(t,.1,2.2);cut('coast-ship',116+120*p,58+3*pendulum(t),475,354,pendulum(t)*.006);forewave('coast-bg',t);title('七次远航',44,45,285,t,1.05,'1405—1433');if(t>1.78){ctx.save();ctx.globalAlpha=inAt(t,1.78,.35);paper(51,110,360,40);ctx.fillStyle='#41414a';ctx.font='700 21px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';ctx.textBaseline='middle';ctx.fillText('最远抵达非洲东海岸',67,132);ctx.restore()}}
const scenes=[scene0,scene1,scene2,scene3];
function draw(i,t){ctx.save();scenes[i](Math.max(0,t-i*5));ctx.restore()}
function rip(i,t){let p=inAt(t,(i+1)*5-.47,.72);if(p<=0)return;let x=976-1010*p;ctx.save();ctx.beginPath();ctx.moveTo(960,0);for(let y=0;y<=540;y+=12)ctx.lineTo(x+8*Math.sin(y*.08+i*3)+3*Math.sin(y*.29),y);ctx.lineTo(960,540);ctx.closePath();ctx.clip();draw(i+1,t);ctx.restore();ctx.beginPath();for(let y=0;y<=540;y+=12){let xx=x+8*Math.sin(y*.08+i*3)+3*Math.sin(y*.29);y?ctx.lineTo(xx,y):ctx.moveTo(xx,y)}ctx.strokeStyle='#f4e7c7';ctx.lineWidth=8;ctx.stroke()}
window.render=t=>{ctx.setTransform(2,0,0,2,0,0);let i=Math.min(3,Math.max(0,Math.floor((t-.25)/5)));draw(i,t);if(i<3)rip(i,t);if(window.SHOW_CAPTIONS!==false)subtitle(t)};
Promise.all(files.map(n=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>{art[n]=im;resolve()};im.onerror=()=>reject(new Error(n));im.src='assets-v2/'+n+'.png'}))).then(()=>{window.render(0);window.READY=true}).catch(e=>{console.error(e)});
</script></html>
